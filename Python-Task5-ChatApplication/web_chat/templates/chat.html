{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block body_attrs %}class="chat-page" data-username="{{ username }}" data-default-room="{{ default_room }}"{% endblock %}
{% block content %}
<aside class="sidebar">
  <h2>Rooms</h2>
  <ul id="room-list"></ul>
  <form id="new-room-form">
    <input id="new-room-input" placeholder="new room name" maxlength="30" autocomplete="off">
    <button type="submit">Create</button>
  </form>
  <button id="notify-button" type="button">Enable notifications</button>
  <div class="user-box">
    <span>Signed in as <strong>{{ username }}</strong></span>
    <form method="post" action="{{ url_for('logout') }}"><button type="submit">Log out</button></form>
  </div>
</aside>
<main class="chat-main">
  <header><h2 id="room-title">Connecting...</h2></header>
  <p id="error-bar" class="error" role="alert" hidden></p>
  <ul id="messages" aria-live="polite"></ul>
  <form id="message-form">
    <input id="message-input" placeholder="Type a message... try :smile:" maxlength="500" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</main>
<!-- Socket.IO browser client (needs an internet connection to load) -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='chat.js') }}"></script>
{% endblock %}
