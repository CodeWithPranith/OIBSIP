{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block body_attrs %}class="chat-page" data-username="{{ username }}" data-default-room="{{ default_room }}"{% endblock %}
{% block content %}
<aside class="sidebar">
  <h2>Rooms</h2>
  <ul id="room-list"></ul>
  <form id="new-room-form">
    <input id="new-room-input" placeholder="new room name" maxlength="30" autocomplete="off">
    <button type="submit">Create</button>
  </form>
  <button id="notify-button" type="button">Enable notifications</button>
  <div class="user-box">
    <span>Signed in as <strong>{{ username }}</strong></span>
    <form method="post" action="{{ url_for('logout') }}"><button type="submit">Log out</button></form>
  </div>
</aside>
<main class="chat-main">
  <header><h2 id="room-title">Connecting...</h2></header>
  <p id="error-bar" class="error" role="alert" hidden></p>
  <ul id="messages" aria-live="polite"></ul>
  <form id="message-form">
    <input id="message-input" placeholder="Type a message... try :smile:" maxlength="500" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</main>
<!-- Load the Socket.IO browser client with CDN fallbacks. -->
<script>
(function () {
  const sources = [
    "https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js",
    "https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js",
    "https://unpkg.com/socket.io-client@4.7.5/dist/socket.io.min.js"
  ];
  const status = document.getElementById("room-title");

  function loadSource(index) {
    if (index >= sources.length) {
      status.textContent = "Chat client failed to load";
      const error = document.getElementById("error-bar");
      error.textContent = "Could not load the Socket.IO client. Check your internet connection or CDN access, then refresh.";
      error.hidden = false;
      return;
    }

    const script = document.createElement("script");
    script.src = sources[index];
    script.onload = function () {
      if (typeof window.io === "function") {
        const chatScript = document.createElement("script");
        chatScript.src = "{{ url_for('static', filename='chat.js') }}";
        document.body.appendChild(chatScript);
      } else {
        script.remove();
        loadSource(index + 1);
      }
    };
    script.onerror = function () {
      script.remove();
      loadSource(index + 1);
    };
    document.head.appendChild(script);
  }

  loadSource(0);
})();
</script>
{% endblock %}
