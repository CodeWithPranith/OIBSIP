{% extends "base.html" %}
{% block title %}Register - Chat{% endblock %}
{% block content %}
<main class="card">
  <h1>Create an account</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Username (3-20 letters, numbers or _) <input name="username" required autofocus autocomplete="username"></label>
    <label>Password (min 8 characters) <input name="password" type="password" required autocomplete="new-password"></label>
    <label>Confirm password <input name="confirm" type="password" required autocomplete="new-password"></label>
    <button type="submit">Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</main>
{% endblock %}
